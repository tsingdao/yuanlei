<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }/*群组选择器*/
        #box{
            padding:8px;
            margin:20px;
            border:1px solid #ccc;
            font-size:12px;
            width:480px;
        }
       #box  h3{
            /* 字体大小16px */
            font-size:16px;
            /* 行高33px */
            line-height:33px;
            /* 居中 */
            text-align: center;
            /* 颜色#034 */
            color:#034;
            /* 字间距3px */
            letter-spacing:3px;
       }
       #box>p{
        /* 颜色#666 */
        color:#666;
        /* 首行空2格 */
        text-indent:2em;
        /* 行高150% */
        line-height:150%;
       }
       #box a{
        /* 颜色#034 */
        color:#c00;
        /* 下划线 */
        text-decoration:none;
       }
       .bb{
        /* 颜色#034 */
        color:#034;
        /* 加粗 */
        font-weight:bold;
       }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id="box">
        <h3>CSS进阶</h3>
        <p> 学号：526，姓名：<span class="bb">袁磊</span>，班级：计算机24005，《高级网页设计》设计的学习难度：中等，
            本实例的知识点：CSS 群组选择器和后代选择器。
            <a href="#">【更多】</a>
        </p>      
    </div>
    <!-- 扩展：
     1、学号、姓名、班级的值是蓝色加粗，使用1个css选择器
     2、h2黑底白字居中行高150%
     3、知识点的值蓝底白字。
      -->
</body>
</html>
