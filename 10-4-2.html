<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-4-2 媒体查询响应式布局</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* 页面最小宽度 320px */
      min-width: 320px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 30px 16px;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      color: #fff;
    }

    .yuan-header {
      text-align: center;
    }

    .yuan-header h1 {
      font-size: 28px;
      letter-spacing: 4px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .yuan-header p {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.85;
    }

    /* 当前断点标签 */
    .yuan-tag {
      display: none;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      font-size: 14px;
      letter-spacing: 1px;
    }

    /* ===== 八个盒子的网格 ===== */
    .yuan-grid {
      width: 100%;
      max-width: 1000px;
      display: grid;
      gap: 14px;
      /* 默认（小屏）：一行 1 个 */
      grid-template-columns: repeat(1, 1fr);
    }

    .yuan-box {
      height: 90px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .yuan-box:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 32px rgba(78, 205, 196, 0.45);
    }

    /* 八种颜色循环 */
    .yuan-box:nth-child(1) { background: #ff6b6b; }
    .yuan-box:nth-child(2) { background: #4ecdc4; }
    .yuan-box:nth-child(3) { background: #ffe66d; color: #333; text-shadow: none; }
    .yuan-box:nth-child(4) { background: #6a4cff; }
    .yuan-box:nth-child(5) { background: #ff9f43; }
    .yuan-box:nth-child(6) { background: #2e86de; }
    .yuan-box:nth-child(7) { background: #10ac84; }
    .yuan-box:nth-child(8) { background: #ee5253; }

    .yuan-author {
      font-size: 14px;
      letter-spacing: 2px;
      opacity: 0.85;
    }

    /* ===== 媒体查询：viewport 变化时每行盒子数量变化 ===== */

    /* 平板竖屏 481px ~ 768px：一行 2 个 */
    @media (min-width: 481px) {
      .yuan-grid { grid-template-columns: repeat(2, 1fr); }
      .yuan-tag--sm2 { display: inline-block; }
    }

    /* 小桌面 769px ~ 1200px：一行 4 个 */
    @media (min-width: 769px) {
      .yuan-grid { grid-template-columns: repeat(4, 1fr); }
      .yuan-tag--sm2 { display: none; }
      .yuan-tag--md4 { display: inline-block; }
    }

    /* 大桌面 ≥ 1201px：一行 8 个 */
    @media (min-width: 1201px) {
      .yuan-grid { grid-template-columns: repeat(8, 1fr); }
      .yuan-tag--md4 { display: none; }
      .yuan-tag--lg8 { display: inline-block; }
    }
  </style>
</head>
<body>
  <div class="yuan-header">
    <h1>袁磊</h1>
    <p>拖动浏览器窗口宽度，每行盒子数量随 viewport 变化</p>
  </div>

  <span class="yuan-tag yuan-tag--sm2">≤ 768px · 一行 2 个</span>
  <span class="yuan-tag yuan-tag--md4">769 ~ 1200px · 一行 4 个</span>
  <span class="yuan-tag yuan-tag--lg8">≥ 1201px · 一行 8 个</span>

  <div class="yuan-grid">
    <div class="yuan-box">1</div>
    <div class="yuan-box">2</div>
    <div class="yuan-box">3</div>
    <div class="yuan-box">4</div>
    <div class="yuan-box">5</div>
    <div class="yuan-box">6</div>
    <div class="yuan-box">7</div>
    <div class="yuan-box">8</div>
  </div>

  <p class="yuan-author">作者：袁磊</p>
</body>
</html>
