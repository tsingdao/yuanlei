<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 动画背景颜色</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f2f3f7;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 320px;
      height: 220px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background-color: #ff6b6b;
      box-shadow: 0 20px 50px rgba(31, 35, 48, 0.18);
      animation: change-background 8s ease-in-out infinite;
    }
    @keyframes change-background {
      0%, 20% { background-color: #ff6b6b; }
      25%, 45% { background-color: #4ecdc4; }
      50%, 70% { background-color: #ffd166; }
      75%, 95% { background-color: #6c63ff; }
      100% { background-color: #ff6b6b; }
    }
    @media (max-width: 380px) {
      .box { width: 280px; height: 190px; }
    }
  </style>
</head>
<body>
  <div class="box">颜色会变化</div>
</body>
</html>
