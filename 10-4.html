<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-4 响应式媒体查询布局</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 2rem 1.5rem;
      background: #f3f4f8;
      color: #242632;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .page-header h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .page-header p {
      margin: 0;
      color: #666a79;
      font-size: 1rem;
    }

    .box-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 1rem;
    }

    .box {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      border-radius: 1rem;
      color: #fff;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 30px rgba(30, 35, 50, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .box:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 38px rgba(30, 35, 50, 0.2);
    }

    .box:nth-child(1) { background: #ff6b6b; }
    .box:nth-child(2) { background: #4ecdc4; }
    .box:nth-child(3) { background: #ffd166; color: #4a3b00; }
    .box:nth-child(4) { background: #6c63ff; }
    .box:nth-child(5) { background: #59b3ff; }
    .box:nth-child(6) { background: #ff8fab; }
    .box:nth-child(7) { background: #5dd39e; }
    .box:nth-child(8) { background: #9b59b6; }

    @media (max-width: 1100px) {
      .box-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 1.5rem 1rem;
      }

      .box-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .box {
        min-height: 180px;
      }
    }

    @media (max-width: 430px) {
      .box-grid {
        grid-template-columns: 1fr;
      }

      .box {
        min-height: 140px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>袁磊</h1>
      <p>viewport 变化时，盒子数量随之变化</p>
    </header>

    <section class="box-grid" aria-label="响应式盒子布局">
      <div class="box">盒子 1</div>
      <div class="box">盒子 2</div>
      <div class="box">盒子 3</div>
      <div class="box">盒子 4</div>
      <div class="box">盒子 5</div>
      <div class="box">盒子 6</div>
      <div class="box">盒子 7</div>
      <div class="box">盒子 8</div>
    </section>
  </main>
</body>
</html>
