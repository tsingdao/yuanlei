<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-1-2 背景色随时间变化动画</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
    }

    /* 盒子：背景色在 4 种颜色间循环 */
    .yuan-color-box {
      width: 220px;
      height: 220px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      letter-spacing: 2px;
      /* 16s 一轮，均分 4 个颜色，无限循环 */
      animation: yuan-color-shift 16s linear infinite;
    }

    @keyframes yuan-color-shift {
      0%   { background-color: #ff6b6b; } /* 红 */
      25%  { background-color: #4ecdc4; } /* 青 */
      50%  { background-color: #ffe66d; } /* 黄 */
      75%  { background-color: #6a4cff; } /* 紫 */
      100% { background-color: #ff6b6b; } /* 回到红，无缝衔接 */
    }
  </style>
</head>
<body>
  <div class="yuan-color-box">颜色随时间变化</div>
</body>
</html>
